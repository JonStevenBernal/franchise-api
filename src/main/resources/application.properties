spring.application.name=franchise-api
server.port=${PORT:8080}

# Configuracion MongoDB Reactivo (Spring Boot 4+)
spring.mongodb.database=franchise_db
spring.mongodb.uri=${SPRING_MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/franchise_db}}

# Actuator Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
